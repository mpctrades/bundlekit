# Deploys bundlekit-app on every push to main that touches bundlekit-app/.
# (This repo is a monorepo — bundlekit-web, the static marketing site, is
# not covered by this workflow.)
#
# Two independent things get deployed here, in parallel, after the build
# gate passes:
#   1. shopify-deploy: `shopify app deploy` — pushes shopify.app.public.toml
#      (scopes, webhooks, extensions) to Shopify and syncs it to shops that
#      already have the app installed, not just new installs. This step was
#      previously a manual, easy-to-forget local command — Shopify's own
#      webhook-subscription records for already-installed shops don't
#      update just because the web server redeploys with new code.
#   2. server-deploy: pulls latest code onto the VPS, migrates the DB,
#      rebuilds, and restarts the systemd service actually serving traffic.
#
# One-time setup required (Repo → Settings → Secrets and variables → Actions):
#   Secrets:
#     DEPLOY_HOST            - server hostname/IP (e.g. bundlekit.mpctrades.com)
#     DEPLOY_USER            - SSH user (e.g. devteam02)
#     DEPLOY_SSH_KEY         - private key for a deploy-only key added to the
#                              server's ~/.ssh/authorized_keys (do NOT reuse a
#                              personal key)
#     DEPLOY_PORT            - optional, defaults to 22
#     SHOPIFY_APP_AUTOMATION_TOKEN - an app-scoped token so `shopify app
#                              deploy` can run non-interactively. Confirmed
#                              from the installed @shopify/cli's own source
#                              (v4.7.0): it's checked before the older,
#                              account-wide SHOPIFY_CLI_PARTNERS_TOKEN, which
#                              also still works as a fallback if that's what
#                              you have. Generate it from the Partner
#                              Dashboard → this app → look for an
#                              automation/CI token option (exact menu wording
#                              may vary by dashboard version).
#   Variables (optional overrides; defaults below match the real server as
#   confirmed live on 2026-09-10):
#     BUNDLEKIT_REPO_PATH - absolute path to the repo ROOT on the server,
#                            i.e. the parent of bundlekit-app/ and
#                            bundlekit-web/ (default: /home/devteam02/apps/bundlekit)
#     BUNDLEKIT_SERVICE   - systemd unit name (default: bundlekit.service)
#
# The server checkout must already have its own untracked .env inside
# bundlekit-app/ with the real secrets (SHOPIFY_API_KEY, SHOPIFY_API_SECRET,
# DATABASE_URL, ...) — this workflow only pulls code, runs migrations,
# builds, and restarts the service (it does not create the systemd unit).
name: Deploy bundlekit-app

on:
  push:
    branches: [main]
    paths:
      - "bundlekit-app/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-bundlekit-app
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build, typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bundlekit-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bundlekit-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  shopify-deploy:
    name: Sync app config to Shopify
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: bundlekit-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bundlekit-app/package-lock.json
      - run: npm ci
      - name: shopify app deploy (public/production config)
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
        run: npx shopify app deploy --config public --allow-updates --no-color

  server-deploy:
    name: Deploy web server to VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull, migrate, build, and restart over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ vars.BUNDLEKIT_REPO_PATH || '/home/devteam02/apps/bundlekit' }}"

            git fetch origin main
            git reset --hard origin/main

            cd bundlekit-app
            npm ci
            npm run setup   # prisma generate && prisma migrate deploy
            npm run build

            sudo systemctl restart "${{ vars.BUNDLEKIT_SERVICE || 'bundlekit.service' }}"

            echo "Deployed $(git rev-parse --short HEAD)"
