# Isolated stack on the VPS, behind the shared Traefik. Copied from BrandLens
# so nothing new has to be learned to deploy this.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bundlekit.rule=Host(`bundlekit.mpctrades.com`)"
      - "traefik.http.routers.bundlekit.tls.certresolver=letsencrypt"
      - "traefik.http.services.bundlekit.loadbalancer.server.port=3000"
    networks: [web, internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bundlekit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bundlekit
    volumes:
      - bundlekit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bundlekit"]
      interval: 5s
      retries: 10
    networks: [internal]

volumes:
  bundlekit-db:

networks:
  web:
    external: true
  internal:
