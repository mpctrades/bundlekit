# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a8858b880781d71586cdb9d118edf02c"
name = "BundleKit"
application_url = "https://dev.bundlekit.mpctrades.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#   read_products / write_products -> read the catalog, write the offer metafield
#   write_discounts               -> create the automatic discount the Function runs
#   read_orders                   -> revenue attribution only (Pro analytics)
scopes = "read_products,write_products,write_discounts,read_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://dev.bundlekit.mpctrades.com/auth/callback",
  "https://dev.bundlekit.mpctrades.com/auth/shopify/callback",
  "https://dev.bundlekit.mpctrades.com/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # orders/create payloads carry customer PII (email, address), which also
  # falls under Protected Customer Data approval — see note below. Commented
  # out alongside the compliance topics until that's requested.
  # [[webhooks.subscriptions]]
  # topics = [ "orders/create" ]
  # uri = "/webhooks/orders/create"

  # All three mandatory GDPR compliance webhooks. These are required for App
  # Store review regardless of whether the app stores customer data — the
  # /webhooks/compliance handler already supports all three topics
  # (app/routes/webhooks.compliance.tsx) as honest no-ops for data_request
  # and customers/redact, and a real delete for shop/redact.
  # See https://shopify.dev/docs/apps/launch/protected-customer-data
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "bundlekit-aenkvjsc.myshopify.com"
include_config_on_deploy = true
