server {
    server_name bundlekit.mpctrades.com;
    root /var/www/bundlekit;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bundlekit.mpctrades.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bundlekit.mpctrades.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = bundlekit.mpctrades.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name bundlekit.mpctrades.com;
    return 404; # managed by Certbot


}
